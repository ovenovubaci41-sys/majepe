
name: Build portable Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build portable EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name MajesticRouletteAnalyzer app.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: MajesticRouletteAnalyzer-Windows-x64
          path: dist/MajesticRouletteAnalyzer.exe
          if-no-files-found: error
